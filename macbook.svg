<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" width="720" height="412" role="img" aria-label="MacBook Pro 16-inch, Apple M2 Max">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2735"/>
      <stop offset="55%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f1626"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3e"/>
      <stop offset="100%" stop-color="#232326"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48484d"/>
      <stop offset="45%" stop-color="#2c2c30"/>
      <stop offset="100%" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#2ea8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#19c39c" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <ellipse cx="360" cy="392" rx="286" ry="16" fill="#000" opacity="0.38" filter="url(#soft)"/>
  <ellipse cx="360" cy="386" rx="300" ry="7" fill="#000" opacity="0.3"/>

  <!-- lid -->
  <rect x="112" y="40" width="496" height="316" rx="18" fill="url(#lid)"/>
  <rect x="126" y="54" width="468" height="286" rx="10" fill="#0b0b0d"/>
  <rect x="134" y="62" width="452" height="270" rx="6" fill="url(#screen)"/>
  <rect x="134" y="62" width="452" height="270" rx="6" fill="url(#glow)" opacity="0.28"/>

  <!-- notch -->
  <rect x="322" y="54" width="76" height="14" rx="7" fill="#0b0b0d"/>

  <!-- terminal window on screen -->
  <rect x="168" y="104" width="384" height="192" rx="10" fill="#0d1220" opacity="0.92"/>
  <rect x="168" y="104" width="384" height="26" rx="10" fill="#161d31"/>
  <rect x="168" y="122" width="384" height="8" fill="#161d31"/>
  <circle cx="184" cy="117" r="5" fill="#ff5f57"/>
  <circle cx="202" cy="117" r="5" fill="#febc2e"/>
  <circle cx="220" cy="117" r="5" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="186" y="158" fill="#19c39c">➜</text>
    <text x="206" y="158" fill="#8ab4ff">~/dev</text>
    <text x="252" y="158" fill="#e6edf3">git push origin main</text>
    <text x="186" y="182" fill="#7d8590">Enumerating objects: 42, done.</text>
    <text x="186" y="206" fill="#7d8590">Writing objects: 100% (42/42)</text>
    <text x="186" y="230" fill="#19c39c">✔ shipped</text>
    <text x="186" y="262" fill="#19c39c">➜</text>
    <text x="206" y="262" fill="#8ab4ff">~/dev</text>
    <text x="252" y="262" fill="#e6edf3">npm run build</text>
    <rect x="352" y="251" width="9" height="15" fill="#e6edf3" opacity="0.9"/>
  </g>

  <!-- base: thin wedge deck seen edge-on -->
  <path d="M112 356 H608 L648 374 a6 6 0 0 1 -4 10 H76 a6 6 0 0 1 -4 -10 Z" fill="url(#base)"/>
  <!-- lit top edge of the deck -->
  <path d="M112 356 H608 L620 361 H100 Z" fill="#5c5c63" opacity="0.6"/>
  <!-- shaded front lip -->
  <path d="M100 361 H620 L644 372 H76 Z" fill="#000" opacity="0.12"/>
  <!-- finger notch -->
  <path d="M336 384 q24 -10 48 0 Z" fill="#141417"/>
</svg>
