  <rect x="44" y="417" width="632" height="1.6" fill="url(#lipShine)"/>

  <!-- bounce light along the very bottom edge -->
  <path d="M52 436 H668" stroke="#8f8f99" stroke-width="1.4" opacity="0.3" stroke-linecap="round"/>

  <!-- finger notch cut into the front lip -->
  <path d="M322 417 q38 9 76 0 Z" fill="#1b1b20"/>
