  <!-- trackpad -->
  <path d="M274 401 H446 L456 414 H264 Z" fill="url(#trackpad)" opacity="0.5"/>
  <path d="M274 401 H446 L456 414 H264 Z" fill="none" stroke="#22222a" stroke-width="1.1"/>

  <!-- light falloff across the whole top case -->
  <path d="M104 356 H616 L672 414 L680 418 H40 L48 414 Z" fill="url(#ends)"/>

  <!-- front face of the bottom case -->
  <path d="M40 418 H680 L677 430 a7 7 0 0 1 -7 7 H50 a7 7 0 0 1 -7 -7 Z" fill="url(#frontFace)"/>
  <path d="M40 418 H680 L677 430 a7 7 0 0 1 -7 7 H50 a7 7 0 0 1 -7 -7 Z" fill="url(#ends)"/>

  <!-- machined edge where the top case breaks into the front face -->
